# ==============================================================================
# Sovereign OS - BlueBuild Resmi İmaj Tarifi (Recipe)
# ==============================================================================
name: sovereign-os
description: Yüksek performanslı oyun, donanım maskeleme (HWID) ve Wi-Fi Sentinel işletim sistemi.

# Taban: Valve'ın Steam ve Proton oyun motorlarını, ZSTD sıkıştırmalı Btrfs'i içeren Bazzite
base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  # 1. Dosyaların Sisteme Kopyalanması (files/system -> /)
  - type: files
    files:
      - source: system
        destination: /

  # 2. Gerekli Çekirdek Paketlerin Eklenmesi
  - type: rpm-ostree
    install:
      - python3
      - python3-pip
      - btrfs-progs
      - zstd
      - tcpdump
      - wireless-tools
      - ethtool

  # 3. Donanım Maskeleme ve Ağ Servislerinin Başlatılması
  - type: systemd
    system:
      enabled:
        - wifi-sentinel.service
        - sovereign-shell.service
